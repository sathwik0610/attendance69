<!DOCTYPE html>
<html>
<head>
<title>Attendance Calculator</title>

<style>

body{
font-family: Arial;
background-color:#f2f2f2;
text-align:center;
}

.container{
margin-top:100px;
background:white;
padding:30px;
width:400px;
margin-left:auto;
margin-right:auto;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

input{
padding:8px;
margin:10px;
width:200px;
}

button{
padding:10px 20px;
background-color:#28a745;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Attendance Calculator</h2>

<label>Total Classes Conducted</label><br>
<input type="number" id="total"><br>

<label>Classes Attended</label><br>
<input type="number" id="attended"><br>

<button onclick="calculate()">Calculate</button>

<h3 id="percentage"></h3>
<h3 id="message"></h3>

</div>

<script>

function calculate(){

var total = document.getElementById("total").value;
var attended = document.getElementById("attended").value;

var percent = (attended/total)*100;

document.getElementById("percentage").innerHTML =
"Attendance: " + percent.toFixed(2) + "%";

if(percent >= 75){

var bunk = Math.floor((attended - 0.75*total)/0.75);

document.getElementById("message").innerHTML =
"You can bunk " + bunk + " classes";

}else{

var need = Math.ceil((0.75*total - attended)/(1-0.75));

document.getElementById("message").innerHTML =
"You need to attend " + need + " more classes";

}

}

</script>

</body>
</html>
